<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- PyScript -->
    <link rel="stylesheet" href="https://pyscript.net/releases/2025.7.3/core.css">
    <script type="module" src="https://pyscript.net/releases/2025.7.3/core.js"></script>

    <title>Project 3rd Quarter</title>

    <style>
        body {
            background: linear-gradient(to right, #ffdddd, #ddddff, #ddffdd, #ffffdd);
        }

        .card {
            border-radius: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }

        .btn-signup {
            background: linear-gradient(to right, #ff4d4d, #4da6ff, #4dff88, #ffff66);
            color: white;
            font-weight: bold;
            border: none;
        }

        .btn-signup:hover {
            opacity: 0.9;
        }

        .navbar-custom {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(6px);
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .navbar-title {
            font-weight: bold;
            color: #555;
        }

        .nav-btn {
            background: linear-gradient(to right, #ff9a9a, #9ac5ff, #9affc2);
            color: #444;
            border: none;
            font-weight: 600;
        }

        .nav-btn:hover {
            opacity: 0.85;
        }
    </style>
</head>

<body>
    <nav class="navbar navbar-custom px-3">
        <span class="navbar-title">Intramurals SY 2025-2026</span>
        <div class="d-flex gap-2">
            <a href="signup.html"><button class="btn nav-btn">Sign Up</button></a>
            <a href="teamchecker.html"><button class="btn nav-btn">Team Checker</button></a>
            <a href="index.html"><button class="btn nav-btn">Players</button></a>
        </div>
    </nav>

    <div class="d-flex justify-content-center align-items-center vh-100">
        <div class="card p-4" style="width: 350px;">
            <h3 class="text-center mb-4">Intramurals Players:</h3>

            <div class="d-grid">
                <input type="button" py-click="list_of_players" value="Click here" class="btn btn-signup">
            </div>

            <div id="output" class="mt-3 text-center"></div>
        </div>
    </div>
    <py-script src="main.py"></py-script>
</body>
</html>
